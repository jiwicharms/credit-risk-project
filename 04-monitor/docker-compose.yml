services:
  prometheus:
    image: prom/prometheus:latest
    container_name: credit-risk-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d

  grafana:
    image: grafana/grafana:latest
    container_name: credit-risk-grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/db.yml:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/credit-risk.json:ro
    depends_on: [prometheus]
